[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainability-closure-theory"
version = "0.1.0"
description = "Reproducible software for Sustainability Closure Theory (SCT)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mohammad Amir Khusru Akhtar"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
